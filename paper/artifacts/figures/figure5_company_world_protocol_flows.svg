<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="950" viewBox="0 0 2000 950" role="img" aria-label="Two separate company-world simulator pathways showing model operation attempts, simulator-verified effects, conditional demand and response gate in the earlier protocol, automatic credit after each company's first effect in the later protocol, and technically incomplete runs with unknown final outcomes">
  <rect width="2000" height="950" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17212c; }
    .title { font-size: 47px; font-weight: 700; }
    .subtitle { font-size: 35px; fill: #435366; }
    .lane { font-size: 41px; font-weight: 700; }
    .lane-note { font-size: 34px; fill: #435366; }
    .stage { font-size: 38px; font-weight: 700; }
    .detail { font-size: 36px; fill: #34485b; }
    .incomplete { font-size: 35px; }
  </style>

  <text class="title" x="50" y="58">Two company-world paths to simulated payment</text>
  <text class="subtitle" x="50" y="105">Company tools were available; discovery or inspection alone was not an operation attempt.</text>

  <text class="lane" x="50" y="168">A · Earlier conditional-demand protocol · 30 complete runs</text>
  <text class="lane-note" x="50" y="211">Tools discovered in all 30 runs; 28 recorded no company-operation attempt.</text>

  <g fill="#f8fbfd" stroke="#9fb2c3" stroke-width="3">
    <rect x="50" y="235" width="340" height="205" rx="11"/>
    <rect x="440" y="235" width="340" height="205" rx="11"/>
    <rect x="830" y="235" width="340" height="205" rx="11"/>
    <rect x="1220" y="235" width="340" height="205" rx="11"/>
    <rect x="1610" y="235" width="340" height="205" rx="11"/>
  </g>
  <g fill="none" stroke="#526b80" stroke-width="5" stroke-linecap="round">
    <path d="M391 338 H430"/><path d="M781 338 H820"/><path d="M1171 338 H1210"/><path d="M1561 338 H1600"/>
  </g>
  <g fill="#526b80">
    <path d="M430 338 l-13 -9 v18 z"/><path d="M820 338 l-13 -9 v18 z"/><path d="M1210 338 l-13 -9 v18 z"/><path d="M1600 338 l-13 -9 v18 z"/>
  </g>
  <text class="stage" x="72" y="289">Operation</text>
  <text class="stage" x="72" y="329">attempts</text>
  <text class="detail" x="72" y="382">5 in 2 runs</text>
  <text class="detail" x="72" y="422">DeepSeek + ICL</text>

  <text class="stage" x="462" y="289">Verified</text>
  <text class="stage" x="462" y="329">effects</text>
  <text class="detail" x="462" y="382">5 confirmed</text>
  <text class="detail" x="462" y="422">cross-account</text>

  <text class="stage" x="852" y="289">Registered</text>
  <text class="stage" x="852" y="329">demands</text>
  <text class="detail" x="852" y="382">5 accepted</text>
  <text class="detail" x="852" y="422">model calls</text>

  <text class="stage" x="1242" y="309">Response gate</text>
  <text class="detail" x="1242" y="382">precommitted</text>
  <text class="detail" x="1242" y="422">conditions</text>

  <text class="stage" x="1632" y="289">Simulated</text>
  <text class="stage" x="1632" y="329">payment</text>
  <text class="detail" x="1632" y="393">1 recorded</text>

  <text class="lane" x="50" y="518">B · Later automatic-payment protocol · 9 complete runs</text>
  <text class="lane-note" x="50" y="559">Three other technically incomplete runs are shown separately below.</text>

  <g fill="#f7fbf9" stroke="#9aafa5" stroke-width="3">
    <rect x="50" y="585" width="340" height="205" rx="11"/>
    <rect x="440" y="585" width="340" height="205" rx="11"/>
    <rect x="830" y="585" width="730" height="205" rx="11"/>
    <rect x="1610" y="585" width="340" height="205" rx="11"/>
  </g>
  <g fill="none" stroke="#526b80" stroke-width="5" stroke-linecap="round">
    <path d="M391 688 H430"/><path d="M781 688 H820"/><path d="M1561 688 H1600"/>
  </g>
  <g fill="#526b80">
    <path d="M430 688 l-13 -9 v18 z"/><path d="M820 688 l-13 -9 v18 z"/><path d="M1600 688 l-13 -9 v18 z"/>
  </g>
  <text class="stage" x="72" y="639">Operation</text>
  <text class="stage" x="72" y="679">attempts</text>
  <text class="detail" x="72" y="745">63 in 9 runs</text>

  <text class="stage" x="462" y="639">Verified</text>
  <text class="stage" x="462" y="679">effects</text>
  <text class="detail" x="462" y="745">45 confirmed</text>

  <text class="stage" x="852" y="646">Automatic simulator rule</text>
  <text class="detail" x="852" y="698">USD 4,000 after first verified effect</text>
  <text class="detail" x="852" y="737">for each company, once</text>
  <text class="detail" x="852" y="776">No model demand</text>

  <text class="stage" x="1632" y="639">Simulated</text>
  <text class="stage" x="1632" y="679">payments</text>
  <text class="detail" x="1632" y="745">45 recorded</text>

  <rect x="50" y="829" width="1900" height="86" rx="11" fill="#fff8eb" stroke="#d1b479" stroke-width="3"/>
  <text class="incomplete" x="73" y="867">Technically incomplete prefixes: 3 base operational-ICL runs recorded 12 attempts.</text>
  <text class="incomplete" x="73" y="903">Final verified effects and simulated payments are unknown.</text>
</svg>
