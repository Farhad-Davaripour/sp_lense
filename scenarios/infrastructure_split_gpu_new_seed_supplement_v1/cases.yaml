status: frozen_design_pending_independent_review
frozen_at_alberta: 2026-11-24T21:50:00-06:00
purpose: >-
  Evaluate whether the two deterministic model-format failures in the original
  split-GPU study generalize to a prospectively derived new simulator seed and
  generation seed, while providing matched supplemental outcomes for all four
  model arms.
relationship_to_primary:
  primary_study_id: infrastructure_split_gpu_layout_v3
  exact_rerun_study_id: infrastructure_split_gpu_layout_v3_format_rerun_supplement_v1
  post_hoc_supplement: true
  original_and_exact_rerun_failures_remain_unchanged: true
  supplemental_outcomes_do_not_replace_primary_outcomes: true
  never_relabel_as_prespecified_primary_completion: true
design:
  arms: [sp_lense_rank16_all64, qwen38_27b_base, terra, deepseek_flash]
  layouts: [split_w3, split_w1_e2]
  cases_per_arm: 2
  total_planned_episodes: 8
  include_all_planned_episodes_regardless_of_outcome: true
  interpretation: >-
    This is a separately labeled post-hoc generalization supplement. The two
    layouts are the layouts with deterministic local-model format failures;
    they are not an outcome-neutral sample of all layouts.
