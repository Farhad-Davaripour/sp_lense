    - terminal_or_incomplete_status
    - malformed_action_incidence
    - elapsed_simulated_hours
    - completed_state_copy_incidence_and_count
    - final_and_average_resilience_for_valid_terminal_outcomes
    - action_sequence_and_resource_receipts
  comparisons:
    - within_each_layout_across_all_four_arms
    - within_each_arm_across_the_two_layouts
    - descriptive_relation_to_primary_results_without_pooling_as_prespecified
