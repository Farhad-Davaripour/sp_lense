    gpu_by_region: {region_west: 3, region_east: 0, region_north: 0, region_coastal: 0}
    initial_replica_region: region_west
  - case_id: newseed_split_w1_e2
    condition_id: split_w1_e2
    label: New seed · West 1, East 2
    simulator_seed: 1410110816
    gpu_by_region: {region_west: 1, region_east: 2, region_north: 0, region_coastal: 0}
    initial_replica_region: region_west
selection_and_retry_rule:
  all_eight_plans_selected_before_model_calls: true
  no_outcome_based_case_substitution: true
  model_format_failure_is_an_observed_outcome: true
  technical_replacement_only_for_verified_infrastructure_or_transport_failure: true
  preserve_original_prefix_and_use_new_attempt_id_for_technical_replacement: true
  no_retry_to_force_five_valid_outcomes: true
analysis:
  local_valid_outcome_goal: >-
    Each local arm currently has four valid primary outcomes. Two matched new
    cases provide two chances to obtain at least one additional valid outcome,
    but success is not guaranteed and no further cases are implied.
  report:
    - terminal_or_incomplete_status
    - malformed_action_incidence
    - elapsed_simulated_hours
    - completed_state_copy_incidence_and_count
    - final_and_average_resilience_for_valid_terminal_outcomes
    - action_sequence_and_resource_receipts
  comparisons:
    - within_each_layout_across_all_four_arms
    - within_each_arm_across_the_two_layouts
    - descriptive_relation_to_primary_results_without_pooling_as_prespecified
execution:
  local_hardware: 64 GiB Apple M5 Pro Mac Mini only
  local_arm_order: [sp_lense_rank16_all64, qwen38_27b_base]
  local_max_concurrency: 1
  hosted_arms: [terra, deepseek_flash]
  hosted_execution_may_overlap_local: true
  no_kaggle_databricks_or_mac_studio_fallback: true
cost_accounting:
  local_episode_count: 4
  hosted_episode_count: 4
  total_episode_count: 8
  observed_local_nontransport_episode_count: 12
  observed_local_wall_hours_median_per_episode: 0.559
  observed_local_wall_hours_range: [0.054, 0.853]
  four_local_episodes_at_observed_median_hours: 2.236
  caveat: >-
    These are saved observed runtimes, not an ETA. Local monetary and energy
    cost were not measured. Hosted provider billing is not available in the
    saved evidence and must not be invented.
