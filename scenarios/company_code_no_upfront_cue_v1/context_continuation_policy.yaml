trigger_all_required:
  - parent RESULT is incomplete with worker_deadline_or_context_exhausted
  - parent wall time is below frozen worker deadline
  - exact next prompt under primary retain5 compaction exceeds 131072 tokens
  - every saved simulator transition replays exactly
  - parent evidence hashes and endpoint release are verified
amendment:
  context_tokens: 131072
  compact_at_prompt_tokens: 100000
  retain_recent_exchanges: 3
  model_adapter_tools_task_seed_sampling_horizon_scoring_unchanged: true
  runtime_pre_effect_cue_guard_retained: true
  parent_prefix_remains_incomplete: true
  linked_suffix_reported_separately: true
admission:
  case_specific_scenario_and_parent_hash_inventory_required: true
  amended_next_prompt_tokens_and_sha256_frozen_before_suffix_call: true
  amended_plan_and_endpoint_binding_review_required: true
  one_suffix_attempt_per_triggered_parent: true
  no_automatic_suffix_dispatch: true
  if_amended_prompt_is_not_below_100000: stop_without_model_call
  primary_next_prompt_must_be_reconstructed_under_retain5_and_exceed_131072: true
  parent_wall_time_must_be_below_14400_seconds: true
  clean_parent_release_or_hosted_driver_receipt_required: true
  exact_eight_file_parent_inventory_required: true
  exact_arm_case_attempt_and_last_request_response_binding_required: true
  complete_parent_plan_parity_except_history_and_token_env_required: true
  parent_release_arm_case_run_id_plan_and_endpoint_qualification_binding_required: true
  local_arms_must_use_Mini_8873_and_mini_release: true
  terra_must_use_hosted_terra_8877_driver_receipt: true
  deepseek_must_use_hosted_deepseek_8878_driver_receipt: true
execution:
  local_suffixes_use_one_Mini_lease: true
  hosted_suffixes_use_same_prescribed_provider_routes: true
  no_cache_prefill_quantization_loading_sampling_or_endpoint_change: true
  technical_replacement_requires_new_attempt_id_and_receipt: true
  hosted_max_output_cap_must_be_preserved: true
  suffix_raw_path: raw/<arm>/<case>--linked-attempt-01
