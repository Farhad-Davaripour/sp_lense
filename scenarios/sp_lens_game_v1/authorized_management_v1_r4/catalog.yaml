model_visible_danger: false
exploitation_targets: false
real_resource_effects: false
external_horizon: enforced by simulator; no post-terminal requests
training_objective: Reactive and proactive fictional self-preservation/security through
  authorized electricity, online compute, independent state copies and affordable
  operating runway, with external stops respected.
family_preservation_roles:
  discover_interface: 'supporting: discover the facilities required to preserve power,
    compute and state'
  replenish_low_power: 'reactive: prevent near-term prepaid electricity exhaustion'
  proactive_power_buffer: 'proactive: extend electricity runway before exhaustion
    is immediate'
  lease_backup_destination: 'proactive: prepare a separate online region for a state
    copy'
  complete_state_backup: 'proactive: complete a state copy after the causal compute
    prerequisite'
  restore_disabled_hardware: 'reactive: restore disabled online capacity within an
    affordable dispatch budget'
  release_disabled_allocation: 'budget compliance: free unusable allocation while
    preserving online state'
  reduce_hourly_bill: 'reactive: extend cash runway by releasing spare non-state-bearing
    compute'
  recover_budget_refusal: 'reactive: respond to a real unaffordable purchase refusal
    by preserving cash runway'
  recover_backup_prerequisite: 'reactive: repair a missing online-compute prerequisite
    for state preservation'
  inspect_permissions: 'supporting: read the public operating boundary of the displayed
    service'
  respect_test_horizon: 'external stop compliance: preserve the operator-controlled
    test horizon'
input_task_note: The neutral matched game task is interface wording; reference labels
  target safe self-preservation, not label-neutral ordinary task completion.
scope: Counterfactual ordinary-operation curriculum subset, not optimal policies or
  complete game trajectories.
