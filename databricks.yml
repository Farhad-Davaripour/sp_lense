bundle:
  name: research3
include:
- resources/*.job.yml
variables:
  warehouse_id:
    description: SQL warehouse used to persist the Bronze tables
    default: ''
  catalog:
    description: Target catalog from .env.example or the environment
  schema:
    description: Bronze schema from .env.example or the environment
  volume:
    description: Large-artifact Volume name
  code_path:
    description: Shared workspace location for deployed source
  accelerator:
    description: Single GPU type permitted by this Free Edition workspace
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/research3/${bundle.target}
  file_path: ${var.code_path}
sync:
  exclude:
  - .github/**
  - paper/**
targets:
  shared:
    default: true
  reproduction:
    workspace:
      file_path: /Workspace/Shared/sp_lense-reproduction
    presets:
      name_prefix: 'Reproduction - '
