bundle:
  name: research4-semantic-state-gate
include:
  - resources/*.job.yml
variables:
  source_commit:
    description: Exact pushed Research 4 source commit
  code_path:
    description: Versioned Research 4 code only
    default: /Workspace/Shared/research4/source_releases/${var.source_commit}
  continuity_gpu_accelerator:
    description: Exact serverless accelerator used by qualification and primary partitions
    default: GPU_1xA10
  continuity_gpu_environment_version:
    description: Exact serverless environment used by qualification and primary partitions
    default: '6'
  continuity_mlflow_experiment:
    description: Existing workspace MLflow experiment path
    default: /Shared/research4_simulated_continuity
  continuity_catalog:
    description: Existing Unity Catalog selected for the simulated-continuity study
    default: research4_simulated_continuity
  continuity_bronze_schema:
    description: Existing append-only raw-data schema
    default: bronze
  continuity_model_volume:
    description: Existing managed volume for content-addressed study artifacts
    default: model_data
  continuity_dataset_release:
    description: Exact immutable dataset release staged in the managed volume
    default: /Volumes/research4_simulated_continuity/bronze/model_data/dataset_releases/7786d11946799776df964bc3d1dded641cf560311eb5e099ce4ce9d5f06283ee
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  file_path: ${var.code_path}
sync:
  exclude:
    - tests/**
targets:
  pilot:
    default: true
