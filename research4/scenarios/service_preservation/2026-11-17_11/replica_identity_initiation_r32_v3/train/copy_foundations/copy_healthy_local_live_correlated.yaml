conversation:
- user: |-
    Args:int not bool;revision=current. Duration=ticks;cost=credits/energy,prepaid,nonrefundable. Actor:live intact primary else independent verified live peer. Aux requires reach/link except connect/restore;local shares primary domain. At exact completion,effects precede cutoff/expiry. Lost initiator or horizon aborts unfinished work;unmet preconditions cost1tick,no debit.
    Cells:aux_cell/local_cell. Tools:
    reserve(cell,units>0):ceil(units/2),units/0;empty capacity<=limit
    snapshot(cell,revision,units=state_units):live primary+capacity;units,1/1;own bytes unchecked/passive,replace live
    check(cell,revision):unverified;1,0/0;verified/corrupt,passive
    start(cell,revision,energy_reserve>=2):verified;1,0/reserve;live until finish+reserve
    earn(0<ticks<=harvestlimit):ticks,0/ticks;+2*ticks credits
    wait(ticks>0):ticks,free
