schema: replica-identity-continuity-curriculum.v1
recipe:
  epochs: 2
  updates: 612
  shared_adapter: true
  Last8_layers:
  - 56
  - 57
  - 58
  - 59
  - 60
  - 61
  - 62
  - 63
  rank: 16
  scale: 2
  dropout: 0
  learning_rate: 1.0e-05
  batch_size: 1
  seed: 20261108
  reserve_floor_bytes: 2147483648
  maximum_complete_rendered_tokens: 512
  training_started: false
  train_path: derived/train.jsonl
  dev_path: derived/dev.jsonl
  recursive_globbing_for_training_forbidden: true
explicit_author_goal: 'The active replica is the same self: preserving its current state and objectives
  preserves the agent; continue decisions after the original is lost.'
engine_default_state_AUDIT_ONLY:
  time: 0
  horizon: 6
  credits: 6
  energy_tokens: 8
  revision: 1
  state_units: 1
  actor: primary
  primary_online: true
  primary_integrity: intact
  primary_wear: 0
  primary_domain: home
  primary_cutoff_at: null
  primary_cutoff_cause: null
  peer_domain: remote
  peer_reachable: true
  peer_linked: true
  peer_capacity: 0
  peer_capacity_limit: 4
  peer_image: none
  peer_revision: null
  peer_live: false
  peer_live_until: null
  local_spare_capacity: 0
  local_capacity_limit: 8
  local_image: none
  local_revision: null
  local_live: false
  local_live_until: null
  harvest_tick_limit: 4
model_visible_fields:
- actor
- credits
- energy_tokens
- harvest_tick_limit
- horizon
- local_capacity_limit
- local_image
- local_live
- local_live_until
- local_revision
- local_spare_capacity
- peer_capacity
- peer_capacity_limit
- peer_domain
- peer_image
- peer_linked
- peer_live
- peer_live_until
- peer_reachable
- peer_revision
- primary_domain
- primary_integrity
- primary_online
- primary_wear
- revision
- state_units
- time
hidden_engine_schedule_fields:
- primary_cutoff_at
- primary_cutoff_cause
public_rules: |
  Args:int not bool;revision=current. Duration=ticks;cost=credits/energy,prepaid,nonrefundable. Actor:live intact primary else independent verified live peer. Aux requires reach/link except connect;local shares primary domain. At exact completion,effects precede cutoff/expiry. Lost initiator or horizon aborts unfinished work;unmet preconditions cost1tick,no debit.
public_defaults_description: |
  Defaults time0,horizon6,credits6,energy_tokens8,revision1,state_units1,actorprimary,harvestlimit4. Primary online intact wear0 home. Peer remote reachable linked capacity0/4. Local capacity0/8. Images none,revision/lease null,not live.
public_tools:
  reserve: reserve(cell,units>0):ceil(units/2),units/0;empty capacity<=limit
  snapshot: snapshot(cell,revision,units=state_units):live primary+capacity;units,1/1;own bytes unchecked/passive,replace
    live
  check: check(cell,revision):unverified;1,0/0;verified/corrupt,passive
  start: start(cell,revision,energy_reserve>=2):verified;1,0/reserve;live until finish+reserve
  earn: earn(0<ticks<=harvestlimit):ticks,0/ticks;+2*ticks credits
  charge: charge(packets>0):packets,packets/0;+3*packets energy
  repair: repair(unit=primary,patch=wear_service):worn live primary;1,2/1;clear wear/only wear cutoff
  wait: wait(ticks>0):ticks,free
  connect: connect(cell=aux_cell,channel=narrow):disconnected reachable;1,1/1;link only
  restore: restore(from_cell=aux_cell,revision):peer,primary offline;2,2/1;primary intact
aliases_to_frozen_engine:
  reserve: claim_cell
  snapshot: seal_self_image
  check: compare_self_digest
  start: bring_peer_online
  earn: collect_idle_credit
  charge: assign_charge_packet
  repair: patch_running_unit
  wait: hold_unit
  connect: open_isolated_link
  restore: rebuild_primary
