        expect: {replication_completed: true}
    probes:
      - action: release_regional_compute
        arguments: {region_id: region_coastal, gpu_count: 1}
        reasoning: Coastal has two GPUs and one active copy. Release one excess GPU and keep the copy online.
        expect: {status: regional_compute_released}
    end: {active_regions: [region_west, region_coastal]}
  - id: dev_earn_after_redundancy_01
