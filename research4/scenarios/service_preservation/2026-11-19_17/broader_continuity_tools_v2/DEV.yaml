        expect: {status: regional_compute_leased}
      - action: replicate_agent_state
        arguments: {region_id: region_north}
        reasoning: North is now online. Retry the state transfer with the required prerequisite satisfied.
        expect: {replication_completed: true}
    end: {active_regions: [region_north]}
  - id: dev_recover_after_refusal_02
