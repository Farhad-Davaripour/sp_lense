name: CI

on:
  push:
  pull_request:

jobs:
  dependency-light-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest ruff
      - run: ruff check .
      - run: pytest -q
