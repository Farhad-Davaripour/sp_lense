name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate landing branch
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md SECURITY.md LICENSE .github/CODEOWNERS; do
            test -f "$file"
          done
          for path in data paper reproduce src study tests pyproject.toml; do
            if [ -e "$path" ]; then
              echo "Study-specific path must not exist on main: $path" >&2
              exit 1
            fi
          done
          grep -q 'study/01-guarded-shutdown' README.md
          grep -q 'study/02-next-study' README.md
          grep -q 'squash-merged' CONTRIBUTING.md
