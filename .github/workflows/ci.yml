name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate landing branch
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md SECURITY.md LICENSE .github/CODEOWNERS; do
            test -f "$file"
          done
          for path in data paper reproduce src study research4 tests config ddl notebooks resources databricks.yml pyproject.toml; do
            if [ -e "$path" ]; then
              echo "Study-specific path must not exist on main: $path" >&2
              exit 1
            fi
          done
          for branch in 01-guarded-shutdown-steering 02-adaptive-activation-steering 03-open-agent-self-preservation 04-semantic-state-gated-lora; do
            grep -Fq "tree/$branch)" README.md
          done
          grep -Fq 'research3-paper-mcp-v2' README.md
          grep -q 'Squash-merge' CONTRIBUTING.md
          grep -q 'Databricks' CONTRIBUTING.md
