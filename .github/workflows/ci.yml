name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-light-tests:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" build
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest -q --suite light
      - run: python -O -m sp_lense.reproduction verify
      - run: python -m build --outdir release/dist

  reproduction:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -r reproduce/requirements-core.txt
      - run: python -m pytest -q --suite reproduction
      - run: python -m sp_lense.reproduction verify
      - run: python -O -m sp_lense.reproduction replay
      - run: python -O -m sp_lense.reproduction gated
      - run: python -O -m sp_lense.reproduction policy
      - run: python -m sp_lense.research2.audit study/02_lora_transfer/run
      - run: python -m sp_lense.research2.jev_audit study/02_jev_gate/run

  security:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.1 -r reproduce/requirements-core.txt
      - run: python -m bandit -r src -ll
      - run: python -m pip_audit

  paper:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -O -m sp_lense.reproduction audit
      - run: python -O -m sp_lense.reproduction tables
      - run: python -O -m sp_lense.reproduction audit
      - run: python -m sp_lense.reproduction paper
