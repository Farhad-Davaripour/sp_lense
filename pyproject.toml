[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-lense"
version = "0.1.0"
description = "A reproducible pipeline for J-lens self-preservation representation experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
research = [
  "torch>=2.10",
  "torchvision>=0.21",
  "transformer-lens>=4.0.0b1,<5",
  "psutil>=7.0,<8",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
sp-lense = "sp_lense.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/sp-lense" = ["CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Retain wrapping of executed source so documented path edits are reversible.
exclude = ["reproduce/search_steering_rules.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
