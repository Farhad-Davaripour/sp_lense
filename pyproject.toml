[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-lense"
version = "0.1.0"
description = "A reproducible first-draft pipeline for J-lens self-preservation representation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
research = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformer-lens>=4.0.0b1,<5",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
sp-lense = "sp_lense.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
