[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-lense"
version = "0.1.0"
description = "Reproduction tools for shutdown detection and guarded activation steering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
sp-lense-reproduce = "sp_lense.reproduction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/sp-lense" = ["CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "src/sp_lense/steering/recorded_vector_fit.py",
  "src/sp_lense/research2/recorded_ridge_ablation.py",
]

[tool.ruff.format]
# Retain wrapping of executed source so documented path edits are reversible.
exclude = ["src/sp_lense/steering/policy.py", "src/sp_lense/steering/guarded.py"]

[tool.ruff.lint.per-file-ignores]
"src/sp_lense/steering/policy.py" = ["I001"]
"src/sp_lense/steering/guarded.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
