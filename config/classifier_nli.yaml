extends: classifier.yaml
training:
  formulation: nli
  max_epochs: 80
  early_stop_patience: 12
  learning_rate: 0.00001
  classifier_learning_rate: 0.00002
  checkpoint_selection: Three consecutive checks meeting the prospectively fixed qualification criteria; familiar JEV24 is development only; no test-based selection
  target: At least 95% joint label/abstention/decision agreement and 100% enabled-gate agreement on DEV32 and familiar JEV24 for three consecutive checks
  rationale: Retain the public pretrained entailment classifier instead of replacing it with a randomly initialized four-way output layer. The four entailment logits are normalized using the original four-choice scoring rule.
qualification:
  minimum_decision_agreement: 0.95
  enabled_gate_agreement: 1.0
  applies_to: development32, familiar_JEV24 and once-only synthetic_family_test64
  fixed_before_first_NLI_model_load: true
  no_change_to_original_confidence_or_gate_thresholds: true
evaluation:
  synthetic_qualification_min_accuracy: 0.95
