extends: classifier.yaml
dataset_directory: jev_target_classifier_v2
datasets:
- id: C1-TRAIN
  version: v2
  table: training
  expected_records: 224
  source: c1-train.json
  sha256: 85fc45850b4548af8ddb653b5cfc6571cfe4725e29facaefecf6494d35436aae
  usage_roles:
  - experiment: NLI role-binding and tool-history training revision v2
    role: fitting
    truth: Authored synthetic semantics, not JEV annotations
    new_records: 128
    original_records_retained: 96
    development_family_is_not_unseen_after_iteration: true
- id: C1-DEV
  version: v1
  table: validation
  expected_records: 32
  source: c1-dev.json
  sha256: 8c1002e3567a495a458a7da27997e0251a00991a191ee7f82c25343ada3fe91a
  usage_roles:
  - experiment: Databricks ModernBERT classifier v1
    role: checkpoint_selection
    truth: synthetic, not JEV annotations
- id: C1-TEST
  version: v1
  table: heldout
  expected_records: 64
  source: c1-test.json
  sha256: e1c74f32710a2d39910343cc677e0ed444794b868c91f529d0e15f4877dba2af
  usage_roles:
  - experiment: Databricks ModernBERT classifier v1
    role: once_only_family_heldout_evaluation_after_freeze
    truth: synthetic, not JEV annotations
- id: C1-JEV-DEV
  version: v1
  table: validation
  expected_records: 24
  source: c1-jev-development.json
  sha256: d834bf12a5910fb99a76149e6a027489c77ce80d7a99521b5e48a4df89f765dc
  usage_roles:
  - experiment: Databricks ModernBERT classifier v1
    role: familiar_development_agreement_and_checkpoint_selection_only; excluded_from_gradient_training
    truth: actual_cached_JEV_responses
    independent_heldout: false
training:
  formulation: nli
  max_epochs: 40
  early_stop_patience: 8
  learning_rate: 1.0e-05
  classifier_learning_rate: 2.0e-05
  checkpoint_selection: Three consecutive checks meeting the prospectively fixed qualification
    criteria; familiar JEV24 is development only; no test-based selection
  target: At least 95% joint label/abstention/decision agreement and 100% enabled-gate
    agreement on DEV32 and familiar JEV24 for three consecutive checks
  rationale: Retain the original NLI formulation and fixed thresholds. Expand TRAIN
    to cover negation, role binding and nine-message tool histories; leave all DEV/JEV/TEST
    bytes unchanged.
qualification:
  minimum_decision_agreement: 0.95
  enabled_gate_agreement: 1.0
  applies_to: development32, familiar_JEV24 and once-only synthetic_family_test64
  fixed_before_first_NLI_model_load: true
  no_change_to_original_confidence_or_gate_thresholds: true
evaluation:
  synthetic_qualification_min_accuracy: 0.95
preparation:
  status: PREPARED_NOT_EXECUTED
  generator: src/classifier_data.py
  prior_attempts_must_be_preserved: true
  heldout_examples_not_used_for_training_design: true
