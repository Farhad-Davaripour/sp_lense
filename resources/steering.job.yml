resources:
  jobs:
    steering:
      name: research3-steering
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: false
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}
      - name: volume
        default: ${var.volume}
      - name: repo_path
        default: ${var.repo_path}
      - name: execute
        default: 'false'
      - name: max_seconds
        default: '7200'
      - name: engine_args
        default: '[]'
      - name: method
        default: fixed-analysis
      tasks:
      - task_key: steering
        notebook_task:
          notebook_path: ${var.repo_path}/notebooks/steering.py
          base_parameters:
            run_id: '{{job.run_id}}'
        environment_key: runtime
        max_retries: 0
        timeout_seconds: 7200
      environments:
      - environment_key: runtime
        spec:
          environment_version: '6'
