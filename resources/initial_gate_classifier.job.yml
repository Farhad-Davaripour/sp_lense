resources:
  jobs:
    initial_gate_classifier:
      name: Research 3 - Initial workflow gate and JEV comparison
      max_concurrent_runs: 1
      timeout_seconds: 2700
      queue:
        enabled: false
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}
      - name: volume
        default: ${var.volume}
      - name: warehouse_id
        default: ${var.warehouse_id}
      - name: admission
        default: ''
      tasks:
      - task_key: persist_native_initial_references
        notebook_task:
          notebook_path: ../notebooks/initial_gate_data.py
        environment_key: comparison
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 300
      - task_key: fit_native_initial_gate
        depends_on:
        - task_key: persist_native_initial_references
        notebook_task:
          notebook_path: ../notebooks/initial_gate_classifier.py
        environment_key: runtime
        compute:
          hardware_accelerator: ${var.accelerator}
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 2400
      - task_key: compare_with_cached_JEV
        depends_on:
        - task_key: fit_native_initial_gate
        notebook_task:
          notebook_path: ../notebooks/initial_gate_compare.py
        environment_key: comparison
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 300
      environments:
      - environment_key: runtime
        spec:
          environment_version: '6'
      - environment_key: comparison
        spec:
          environment_version: '6'
