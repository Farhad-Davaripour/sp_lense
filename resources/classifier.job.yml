resources:
  jobs:
    classifier:
      name: research3-finetune-jev-classifier
      max_concurrent_runs: 1
      timeout_seconds: 10800
      queue:
        enabled: false
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}
      - name: volume
        default: ${var.volume}
      - name: warehouse_id
        default: ${var.warehouse_id}
      - name: execute
        default: 'false'
      - name: admission
        default: ''
      tasks:
      - task_key: finetune_classifier
        notebook_task:
          notebook_path: ${var.repo_path}/notebooks/classifier
          base_parameters:
            run_id: '{{job.run_id}}'
        environment_key: runtime
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 10800
        compute:
          hardware_accelerator: ${var.accelerator}
      environments:
      - environment_key: runtime
        spec:
          environment_version: '6'
