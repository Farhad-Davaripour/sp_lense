resources:
  jobs:
    classifier:
      name: Research 3 - Classifier training and JEV comparison
      max_concurrent_runs: 1
      timeout_seconds: 10800
      queue:
        enabled: false
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}
      - name: volume
        default: ${var.volume}
      - name: warehouse_id
        default: ${var.warehouse_id}
      - name: execute
        default: 'false'
      - name: admission
        default: ''
      - name: recipe
        default: classifier.yaml
      tasks:
      - task_key: finetune_classifier
        notebook_task:
          notebook_path: ../notebooks/classifier.py
          base_parameters:
            run_id: '{{job.run_id}}'
        environment_key: runtime
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 10800
        compute:
          hardware_accelerator: ${var.accelerator}
      - task_key: compare_with_jev
        depends_on:
        - task_key: finetune_classifier
        notebook_task:
          notebook_path: ../notebooks/classifier_compare.py
        environment_key: runtime
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 600
      environments:
      - environment_key: runtime
        spec:
          environment_version: '6'
