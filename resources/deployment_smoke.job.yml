resources:
  jobs:
    deployment_smoke:
      name: Research 3 - Verify shared deployment
      max_concurrent_runs: 1
      timeout_seconds: 1200
      queue:
        enabled: false
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}
      - name: volume
        default: ${var.volume}
      - name: code_path
        default: ${workspace.file_path}
      - name: expected_commit
        default: ''
      - name: expected_source_digest
        default: ''
      tasks:
      - task_key: verify_shared_deployment
        notebook_task:
          notebook_path: ../notebooks/deployment_smoke.py
        environment_key: runtime
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 1200
      environments:
      - environment_key: runtime
        spec:
          environment_version: '6'
