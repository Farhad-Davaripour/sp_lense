resources:
  jobs:
    persist_data:
      name: Research 3 - Persist Bronze datasets
      max_concurrent_runs: 1
      timeout_seconds: 900
      queue:
        enabled: false
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}
      - name: volume
        default: ${var.volume}
      - name: warehouse_id
        default: ${var.warehouse_id}
      - name: execute
        default: 'false'
      tasks:
      - task_key: persist_data
        notebook_task:
          notebook_path: ../notebooks/persist_data.py
        environment_key: runtime
        max_retries: 0
        disable_auto_optimization: true
        timeout_seconds: 900
      environments:
      - environment_key: runtime
        spec:
          environment_version: '6'
