resources:
  jobs:
    oracle_recovery_development:
      name: Research 4 - Oracle policy recovery development
      max_concurrent_runs: 1
      timeout_seconds: 2100
      performance_target: STANDARD
      queue:
        enabled: false
      tags:
        aidevkit_project: ai-dev-kit
        research: research4
        study: oracle-policy-recovery-development
        source_commit: ${var.source_commit}
      parameters:
        - name: mode
          default: probe
        - name: probe_run_id
          default: ''
      tasks:
        - task_key: oracle_policy_development
          notebook_task:
            notebook_path: ../notebooks/recovery.py
            base_parameters:
              run_id: '{{job.run_id}}'
              source_commit: ${var.source_commit}
              code_path: ${var.code_path}
              mode: '{{job.parameters.mode}}'
              probe_run_id: '{{job.parameters.probe_run_id}}'
          environment_key: recovery_cpu
          timeout_seconds: 2100
          max_retries: 0
          disable_auto_optimization: true
      environments:
        - environment_key: recovery_cpu
          spec:
            environment_version: '6'
            dependencies:
              - --extra-index-url https://download.pytorch.org/whl/cpu
              - torch==2.11.0+cpu
              - transformers==5.19.0
              - safetensors==0.8.0
              - numpy==2.2.2
              - pandas==2.2.3
              - PyYAML==6.0.3
              - databricks-sdk==0.153.0
              - psutil==7.2.2
              - mlflow==3.1.0
