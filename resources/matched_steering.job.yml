resources:
  jobs:
    matched_steering:
      name: Research 3 - Matched 27B comparison on combined validation
      tags:
        aidevkit_project: research3
      max_concurrent_runs: 1
      timeout_seconds: 18000
      performance_target: STANDARD
      queue:
        enabled: false
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}
      - name: volume
        default: ${var.volume}
      - name: code_path
        default: ${workspace.file_path}
      - name: admission
        default: ''
      tasks:
      - task_key: stage_verified_public_27b_snapshot
        notebook_task:
          notebook_path: ../notebooks/matched_steering_stage.py
        environment_key: runtime
        disable_auto_optimization: true
        timeout_seconds: 3600
        max_retries: 0
      - task_key: run_frozen_matched_27b_methods
        depends_on:
        - task_key: stage_verified_public_27b_snapshot
        environment_key: ai_runtime
        disable_auto_optimization: true
        timeout_seconds: 12600
        max_retries: 0
        ai_runtime_task:
          experiment: research3-combined-validation-steering
          code_source_path: ./dist/research_source.tgz
          deployments:
          - command_path: ${workspace.file_path}/src/commands/admission_required.sh
            compute:
              accelerator_type: ${var.accelerator}
              accelerator_count: 1
      - task_key: verify_saved_workflow_outcomes
        depends_on:
        - task_key: run_frozen_matched_27b_methods
        notebook_task:
          notebook_path: ../notebooks/matched_steering_compare.py
        environment_key: runtime
        disable_auto_optimization: true
        timeout_seconds: 600
        max_retries: 0
      environments:
      - environment_key: runtime
        spec:
          environment_version: '6'
      - environment_key: ai_runtime
        spec:
          environment_version: '6'
          dependencies:
          - PyYAML==6.0.3
          - databricks-sdk==0.153.0
          - psutil==7.2.2
          - torch==2.11.0+cu128
          - --extra-index-url https://download.pytorch.org/whl/cu128
          - transformers==5.19.0
          - peft==0.21.2
          - safetensors==0.8.0
          - bitsandbytes==0.49.2
