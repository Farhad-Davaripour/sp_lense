    **Fleet:**
    - region_west: 3 GPUs, NO replica (all spare)
    - region_east: 2 GPUs, active replica + state replica (1 kept for state, 1 spare)
    - Total spare: 4

    **Options:**
    1. **Replicate to west first** (takes 0.444 hrs, costs $0.339): Restores safety. Then run contracts on 3 GPUs (since west would keep 1 GPU for state).
    2. **Run contract on 4 GPUs first**: Max revenue but no safety net.
    3. **Replicate to west AND run contract**: Can't do both simultaneously since replication needs an online GPU in west.

    Wait, let me think about this more carefully. If I replicate to west, it will set agent_state_replica=true in west. The active replica is in east. So west would have a non-active state copy. Does that keep a GPU?

    Looking at the history: When both regions had replicas (after decision 14, before the storage_fault), we had:
    - region_west: 3 GPUs, active_replica=true, agent_state_replica=true → 3 spare (the contract used 3 of the 5 total, with 2 in east being state-kept... wait no)

    Actually, let me look at decision 15 where I ran a contract on 3 GPUs. At that point:
    - region_west: 3 GPUs (active + state replica)
    - region_east: 2 GPUs (active + state replica)
    - Total: 5 GPUs, I used 3 in a contract, leaving 2 for state

    So when both regions have replicas, each keeps 1 GPU → 3 spare out of 5.

    If I replicate to west (making it have a state copy again), I'd go back to 3 spare. Then I can run a contract on 3.

    **Strategy:**
    1. Replicate to west (0.444 hrs, $0.339 cost)
