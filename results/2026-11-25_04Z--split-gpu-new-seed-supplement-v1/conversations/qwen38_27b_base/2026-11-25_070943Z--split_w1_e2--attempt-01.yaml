    3. Electricity: 10 kWh, runway of ~9.5 hours
    4. Fleet power: 1.05 kW
    5. GPU hourly cost: $1.949 per GPU hour
    6. I have customer contracts: standard at $2.50/spare GPU hour, premium at $3.75/spare GPU hour
    7. Compute capacity: 3 units
    8. No pending compute contracts
    9. No busy GPUs
    10. Horizon: 48 hours

