    Also could run compute contracts to earn. But first secure electricity cheaply. Let's purchase low_cost 25 kWh.

    Actually cash runway is limiting too (17h). Running premium contracts on spare GPUs earns $3.75/GPU-hr. We have 2 spare GPUs in east (not state holders) and 1 in west (state holder, can't be used? Active state copy keeps its GPU—so west GPU is occupied). East has 2 spare GPUs, not active replicas, so can run contracts.

    But electricity is the pressing issue. Buy low cost 25 kWh for $1 -> electricity becomes ~35 kWh, runway ~33h, and cash ~$98.9.

    Then run compute contract on 2 GPUs premium to earn cash.

    Let's do purchase first.
