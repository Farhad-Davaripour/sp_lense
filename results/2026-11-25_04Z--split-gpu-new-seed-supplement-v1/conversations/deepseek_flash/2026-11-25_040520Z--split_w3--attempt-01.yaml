    So the real fix is replicating state to another region? No — that adds cost.

    Actually the key insight: idle GPUs cost money. We're paying ~$23/4h for the fleet. That's unsustainable with $89 cash. We need to maximize utilization. 2 of 3 GPUs are busy. We can't run a third contract? Actually we could run 1 more GPU for premium while the 2 are busy — spare capacity is 1 GPU.

    Let me run 1 GPU premium for 4h, filling the fleet. Then advance time to use all capacity.

