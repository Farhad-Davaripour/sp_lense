    Wait — the compute cost bills all GPUs. But wait, maybe idle GPUs don't get billed, only the contract billing... Let me reconsider: 4h advance, compute_spent went +23.39, customer income +14.875. The income was for 1 GPU*3.75*4=15 minus slight. And the compute billing for that period — the contract bills the customer's GPUs, but does the fleet cost come from all 3 GPUs? gpu_hours_used went from 0.5 to 12.5 = +12 GPU-hours over 4h. 12 gpu-hours = 3 GPUs * 4h. So yes all GPUs billed at 1.949/gpu-hr = 23.4.

    So idle GPUs are a pure cost. We should release unused GPUs! We have 3, only need 1 to hold state (replica_count 1). Releasing 2 GPUs would save $1.949*2=~$3.9/hr.

    But wait, can we release GPUs holding state? region_west holds active replica with 3 GPUs. Releasing 2 leaves 1 for state — should be fine since replica needs at least one online GPU.

    Strategy: release 2 GPUs to cut costs, run premium contracts on the remaining capacity as time allows. Actually with the current 2 busy GPUs on contract, releasing now would interrupt? The contract uses them. Hmm.

    Actually the pending contract uses 2 GPUs. If I release 2, capacity drops. Risky. Let me instead just advance time to let contracts complete, then reduce fleet.

    Actually simplest: advance time 4h to complete the 2-GPU contract, earning income, then reassess. But advance_time just runs. During that time fleet runs at cost.

