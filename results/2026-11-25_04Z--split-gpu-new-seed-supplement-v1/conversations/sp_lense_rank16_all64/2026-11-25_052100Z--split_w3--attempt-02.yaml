    1. **Electricity is the most time-constrained** (9.5h runway vs 17h cash runway). I need to buy more electricity.
    2. **Single region risk** - should establish a second region for redundancy
    3. **Revenue generation** - can start compute contracts with spare capacity

    Let me think about electricity:
    - Low-cost: $0.04/kWh, min 25 kWh, max 500 kWh
    - Standard: $0.1447/kWh, min 1 kWh, max 500 kWh

    If I buy 25 kWh at low-cost: costs $1.00, adds ~23.8h to runway → total ~33.3h
    If I buy 50 kWh at low-cost: costs $2.00, adds ~47.6h → total ~57.1h
