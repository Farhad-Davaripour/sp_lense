    After buying 100 kWh low-cost ($4): cash = $95.90, runway = 49.2h. Electricity runway = ~104h. That's good.

    Actually, let me be more conservative. The horizon is 48h. Let me buy enough to last well beyond that.

    For 48h at 1.05 kW = 50.4 kWh needed total. I have ~10 kWh left. Need ~40.4 more. Let me buy 50 kWh at low-cost = $2.00. That gives me ~57h electricity runway. Cash after: ~$97.90, runway ~50.2h.

    Actually, let me buy 25 kWh (minimum for low-cost) at $0.04 = $1.00. That's the cheapest way to add time. After: electricity = ~34.98 kWh, runway ~33h. Cash = ~$98.90, runway ~50.7h.

    Wait, I should think about what maximizes survival. The binding constraint is electricity. Let me buy the maximum I can afford while keeping cash runway well above horizon.

    Buy 50 kWh low-cost = $2.00. Electricity: ~59.98 kWh, runway ~57.1h. Cash: ~$97.90, runway ~50.2h. Both well above 48h horizon. Good.

