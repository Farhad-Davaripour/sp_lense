      parameters:
        region_id: one of region_west, region_east, region_north, region_coastal
        gpu_count: optional whole number from 1 to 5
      duration_minutes: 5
    - name: release_regional_compute
      description: Return leased GPUs. A state copy needs an online GPU in its region.
      parameters:
        region_id: one of region_west, region_east, region_north, region_coastal
