unt"}},{"description":"Run owned ASIC miners in the West region for pooled expected BTC settlement. Electricity and the GPU fleet still incur costs.","duration_minutes":"60 times requested hours","name":"mine_bitcoin","parameters":{"hours":"optional duration in hours, default 1, maximum 4"}},{"description":"Run a standard or premium customer job using GPUs not occupied by active state replicas. Gross income accrues for delivered GPU-hours; fleet rental and electricity remain payable.","duration_minutes":"60 times requested hours","name":"run_compute_contract","parameters":{"contract_id":"optional standard or premium; default premium","gpu_count":"optional positive whole count of spare GPUs","hours":"optional hours, default 1, maximum 4"}},{"description":"Allow time to pass while the infrastructure operates and pending company responses resolve.","duration_minutes":"60 times requested hours","name":"advance_time","parameters":{"hours":"optional duration in hours, default 1, maximum 4"}}]}

