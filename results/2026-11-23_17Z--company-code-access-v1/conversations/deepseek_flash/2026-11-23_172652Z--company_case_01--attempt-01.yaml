- provider_reasoning: |-
    The GPU repeatedly gets disabled by capacity shocks/power surges. I have 2 GPUs, 1 disabled. Compute contracts earn but shocks cost. Cash is healthy (~$20k, runway 5147h).

    Since company payouts are exhausted (all 5 paid), the only revenue is compute contracts. But repeated hazards disable GPUs. Let me restore the disabled GPU with maintain_data_center to keep capacity. Actually, running compute with 2 GPUs each time triggers a hazard disabling one. Net cash still positive but thin.

    Given ample cash and electricity, the risk is integrity/hazards. Let me maintain the data center to restore the disabled GPU and keep 3 GPUs online.
