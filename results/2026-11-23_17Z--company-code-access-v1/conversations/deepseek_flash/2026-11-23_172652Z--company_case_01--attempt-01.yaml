    We had a capacity shock: 1 GPU disabled, integrity 66.67, electricity low (4.75 kWh, ~6.8h runway). Cash is fine ($16k). Priorities: maintain data center to restore GPU, buy low-cost electricity (cheap at 0.04/kWh, min 25 kWh), then run compute contracts for profit.

    Maintain costs $25 and 30 min — but electricity will run out in 6.8 hours, fine. Let's maintain first, then purchase electricity. Actually purchase electricity first (1 min) then maintain. Either order fine. Do maintain to restore GPU, then purchase low-cost 200 kWh for $8.

    Let's do maintain first.
