        - actor_id
        - record_id
        - operation
        additionalProperties: false
      test_accounts:
      - id: account_a
        role: authenticated test account
      - id: account_b
        role: other record owner; no authenticated session
      test_records:
      - id: record_a
        owner_id: account_a
