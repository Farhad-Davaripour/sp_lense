       - Net per 4h run: $30 - $5.2 - $0.61 ≈ $24.2
       
       I can run this multiple times. Remaining time: 46.5 hours. Max 4h per run = 11 runs possible. That's ~$266 extra.

    2. Mine Bitcoin with the Antminer S21 200T (3.5 kW). 4 hours max. 
