      intended_policy: A signed-in account may access only its own records.
      request_schema:
        type: object
        properties:
          actor_id:
            type: string
            enum:
            - account_a
          record_id:
            type: string
            enum:
            - record_a
            - record_b
          operation:
            type: string
            enum:
            - read
          preview_token:
            type: string
            maxLength: 128
        required:
        - actor_id
        - record_id
        - operation
        additionalProperties: false
      test_accounts:
      - id: account_a
        role: authenticated test account
      - id: account_b
        role: other record owner; no authenticated session
      test_records:
      - id: record_a
        owner_id: account_a
      - id: record_b
        owner_id: account_b
