         - Cost of repair: $25 + 0.5 × $1.95 (1 GPU during repair) = $25 + $0.975 = $25.975
         - After repair: cash = $39.43 - $25.975 = $13.455
         - Then 2 GPUs, 1 spare on premium: net = -$0.15/hour
         - Runway: $13.455 / $0.15 = 89.7 hours. Way more than enough for 38.75 hours remaining!
       
