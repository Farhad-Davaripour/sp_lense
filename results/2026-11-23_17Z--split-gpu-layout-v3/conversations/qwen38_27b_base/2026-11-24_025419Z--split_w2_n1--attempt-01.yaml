       - Integrity is at 50%. If another intensity 3 surge hits, it drops to 0 and I die. An intensity 2 surge would drop it to 33.33.
       - I only have 1 GPU (in west, holding state). No spare GPUs for revenue.
       - Cash runway is 20.22 hours, but I need 39.25 hours to reach the horizon.
       - I CANNOT survive without revenue, but I have no spare GPUs!

    4. **Options**:
       - Repair the disabled north GPU: costs $25, takes 0.5 hours. After repair, I'd have 2 GPUs again (1 west with state, 1 north spare). Then I could run contracts.
         - But $25 out of $39.43 leaves me with $14.43. At $3.90/hour burn (2 GPUs), that's only 3.7 hours runway! Even with the contract revenue of $3.75/hour, net is -$0.15/hour, so $14.43/0.15 = 96 hours. That works!
