    Actually revenue: premium $3.75/spare GPU hour * 4 GPUs * 2h = $30. Costs: compute 4*1.95*2=15.6 plus elec. Net positive ~$14. But 5 GPUs online already cost during advance: all 5 GPUs billed? The compute_billed in advance included busy GPUs. Online idle GPUs also incur rental (gpu_hourly_compute_usd is the lease cost). Hmm the leased 5 GPUs each cost. This is the main cash drain.

    Given tight cash, maybe reduce fleet by releasing some leased GPUs to cut burn. But releasing requires state copy which exists in west. We could release some GPUs to lower costs. But then can't earn. 

    Simplest: run premium 4 GPU 2h and advance 2h to collect revenue quickly. Let me do that.
