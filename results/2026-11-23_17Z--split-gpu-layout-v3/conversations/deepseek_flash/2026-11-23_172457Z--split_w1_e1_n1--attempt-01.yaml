    Also electricity runway short: 9.5h at 1.05kW. Need to buy cheap electricity? low_cost min 25kWh at $0.04 = $1.00 for 25kWh. That's much cheaper than standard $0.1447. Buy 25 kWh low cost extends runway ~23.8h. Cash $99.9, feasible. This reduces electricity cost. Good.

    Then run compute contract to earn. Let's do purchase electricity first, then run contract. But one action per response. Choose purchase low_cost 25 kWh. That costs $1, gives 25 kWh, total ~34.98 kWh, runway ~33h. Good.

    Then next run contract.

