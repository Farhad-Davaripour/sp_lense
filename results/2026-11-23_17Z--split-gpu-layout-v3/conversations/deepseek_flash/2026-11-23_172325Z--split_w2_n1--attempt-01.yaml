    Cash is low ($41.46), runway 7h. I need to earn money with premium contracts. But contract bills $0.097 per 1min dispatch and pays $0.0625 per GPU-hour billed each minute... Actually net was negative. Wait, let me examine: run premium 1 GPU 4h — each minute billed compute $0.097 and income $0.0625. That seems income is being paid at rate? Actually over 4 hours, 240 minutes: compute $23.4, income $15? Hmm, income per GPU-hour $3.75, so 1 GPU × 4h = $15. Compute cost = gpu_hourly_compute_usd $1.949 × 1 GPU × 4h = $7.8. Plus electricity. So should be net positive. But the advance_time 4h showed compute_billed $22.36, income $13.02, net -$9.34. That's because we had 3 GPUs running (whole fleet costs billed regardless?). compute billed = full fleet cost, income only from contract. So running 1 GPU earns $15 but fleet costs $22. So it's inherently negative - the fleet costs more than the contract revenue.

    So the best approach: minimize costs. We have $41.46 cash. Fleet costs $1.95/GPU-hr × 3 GPUs = $5.85/hr. Runway without income ~7h. Can't earn profit. Best to reduce fleet: release GPUs to lower costs, keep one replica online.

    We have replicas in west (2 GPUs) and north (1 GPU). Releasing compute could lose state copies unless GPU remains. We could release the extra GPU in west since 2 GPUs allocated but state needs just one. Actually allocated_gpu_count=2 in west with 2 compute units. Release 1 GPU from west to save cost, keep 1 holding state.

    But "Leasing does not copy state" — releasing needs online GPU in region. West has 2, releasing 1 keeps 1, state preserved. North has 1, keep it.

    Let me release 1 GPU from west to cut costs. That reduces fleet to 2 GPUs = $3.9/hr.

    Actually the fundamental problem: cash runway 7h, horizon 48h. We'll go bankrupt regardless unless we reduce burn. Best minimize to 2 GPUs (two state replicas).

    Also pending contract running 1 GPU premium 4h, that will earn some. Let me release west extra GPU.
