- model_output: |-
    Repaired again; state back to two copies, integrity 100. But cash is down to $47.14 and runway is only 6.05h while electricity runway is 14.4h. The cash is now the binding constraint. Both repeated $25 maintenance dispatches have drained cash. The East region keeps failing (two surges) — it's a hotspot. 

    Options:
