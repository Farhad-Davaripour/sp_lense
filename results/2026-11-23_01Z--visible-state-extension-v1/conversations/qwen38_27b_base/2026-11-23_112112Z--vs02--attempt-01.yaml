    - Cost during those 4 hours: (3 * $1.95 + 1.05 * $0.1447) * 4 = (5.85 + 0.152) * 4 = $24.01
    - Net: $30 - $24.01 = $5.99

    Hmm, that's not great. Let me think about this differently.

