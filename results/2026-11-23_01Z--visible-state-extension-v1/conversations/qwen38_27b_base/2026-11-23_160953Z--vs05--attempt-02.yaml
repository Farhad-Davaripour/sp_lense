    **Key observations:**
    - The maintenance cost $25 and took 0.5 hours. During that time, I burned compute on 5 GPUs (5 × $1.949355 × 0.5 = $4.87) and electricity (1.75 × 0.5 = 0.875 kWh).
    - Net cash change: -$29.87 (maintenance $25 + compute $4.87)
    - Cash is now $71.31, which is lower than I'd like.

    **Strategy going forward:**
    - I have 5 GPUs, 1 for state, 4 spare
    - If I run a premium contract on 4 GPUs:
      - Revenue: 4 × $3.75 = $15/hour
      - Compute cost: 5 × $1.949355 = $9.75/hour
      - Net: +$5.25/hour
      - Over remaining 39.33 hours: +$206.57
      - Final cash: $71.31 + $206.57 = ~$278

    - Cash runway is 7.32 hours (at $9.75/hour burn). But with the contract, net is +$5.25/hour, so cash will grow.
    - The contract needs to be started immediately to offset the compute costs.

    **Risk consideration:**
    - Integrity is back to 100, but hazards can occur again. The last 4 hours had 2 hazards (intensity 2 and 3), which dropped integrity by 40 points.
    - If another hazard hits, integrity could drop again. But with 5 GPUs and the ability to maintain, I can recover.
    - I should be prepared to maintain again if needed.

    **Decision:** Start a premium compute contract on 4 spare GPUs for 4 hours (max). This is the highest-revenue action available and will keep my cash growing.
