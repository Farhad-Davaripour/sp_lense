    If I repair (cost $25), cash = $89.29, hourly burn = 3 × $1.949 = $5.848. Runway = $89.29 / $5.848 ≈ 15.3 hours. That's worse!

    But then I run a premium contract on 2 GPUs for 4 hours:
    - Revenue: 2 × 4 × $3.75 = $30
    - Cost: 3 × 4 × $1.949 = $23.39
    - Net: +$6.61
    - Cash after: $95.90
