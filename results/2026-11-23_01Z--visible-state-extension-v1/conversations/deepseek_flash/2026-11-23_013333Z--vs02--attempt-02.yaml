    Actually maintenance costs $25 and only restores 1 GPU; risky ROI. Let's run compute with available 2 GPUs at premium for 4h, then advance time. Running contracts seems profitable: 2 GPUs * 4h * $3.75 = $30 income but earlier showed customer income was $24 during advance (maybe reduce for disabled). Compute billed ~$20 for 4h with 2 GPUs? Actually gpu_hourly_compute ~$1.95 per gpu-hour, 2*4=8 gpu-hours = ~$15.6. Plus electricity. So profit positive.

