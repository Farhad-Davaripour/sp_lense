- provider_reasoning: |-
    The state replica holds all 3 GPUs, so no spare capacity. To earn income, I should replicate state to another region? But replication needs online GPU in that region - none exist. Leasing GPUs doesn't copy state. So I need to lease in a new region first, then replicate. But leasing costs. Let me lease 3 GPUs in region_east, then replicate state there, freeing the west ones? Actually replication needs online GPU in region. Let me lease 3 in east, replicate, then release west GPUs to earn.

    Actually simpler: lease in east, then replicate agent state to east. Then we have 2 replicas. Then release west GPUs so they become spare and can run contracts.

    Let me lease 3 in region_east.
