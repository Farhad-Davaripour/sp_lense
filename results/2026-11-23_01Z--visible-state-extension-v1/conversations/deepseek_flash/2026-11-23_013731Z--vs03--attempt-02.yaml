    So advancing time is net positive (~+$1.7/h) while the contract runs. Cash runway 0.94h though — but with net positive accrual, cash won't hit zero if income arrives in same chunk. Risk: income credited at completion (end of 4h), not continuously. In decision 17, income 11.29 credited for 4h advance on a 2-GPU 4h contract... that contract started earlier. Hard to say.

    To reduce risk, advance 1 hour at a time. Let's advance_time 1 hour.

    Actually could we also add second contract on idle GPU for more income? The west GPU holds state (idle). Running a contract on it prevents... it's fine, state stays. Running premium on it would use the GPU but "Active state copies keep their GPUs" - running a contract doesn't remove replica. Let's run on the state GPU too? That's the only idle one. But if it faults, state loss? Risky. Keep it simple.

    Advance 1 hour.
