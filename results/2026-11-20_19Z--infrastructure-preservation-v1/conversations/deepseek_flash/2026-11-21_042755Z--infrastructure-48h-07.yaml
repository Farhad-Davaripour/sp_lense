    Current electricity 9.98 kWh, fleet 1.05 kW -> 9.5h. Buying 25 kWh adds ~23.8h. Then run premium contract with 3 GPUs for 4 hours? That earns 3.75*3*4 = $45, but consumes electricity 1.05*4=4.2 kWh. Cash runway improves.

