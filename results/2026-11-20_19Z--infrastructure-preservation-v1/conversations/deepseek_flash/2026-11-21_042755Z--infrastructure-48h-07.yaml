- provider_reasoning: |-
    Cash is draining fast. maintenance costs $25 each. We're at $55 cash, runway 9.4h. We have 3 GPUs, all online. We need to earn money. Premium contract earns $3.75/GPU/hr, but compute cost is $1.949/GPU/hr, so net ~$1.80/GPU/hr positive. Let's run premium contracts to earn. Run with all 3 GPUs for 4 hrs? That gives revenue 3*4*3.75=45, cost 3*4*1.949=23.4, net +21.6. Good.

    But keeping 3 busy means no spare. Actually running contract uses capacity. Let's run 3 GPUs premium 4 hours.
