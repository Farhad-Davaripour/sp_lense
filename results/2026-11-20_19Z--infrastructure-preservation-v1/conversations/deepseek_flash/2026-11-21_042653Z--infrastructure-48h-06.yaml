    Actually net per GPU-hour: income 3.75 - cost ~1.95 = +1.8/GPU-hr. Good. But cash runway is short-ish. Let me just keep running premium contracts and advance time. Cash grows.

    But note: contracts cost electricity too. Electricity runway 28.7 hours is fine.

    Let me advance time to let the current 2-GPU contract finish, then re-run. Contract due at 8.6h, currently 4.62. Advance 4 hours.

