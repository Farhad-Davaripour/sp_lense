    The key risk: capacity shock disabled a GPU during the 4-hour advance. To be resilient, I should replicate state to another region so a single region's shock doesn't kill us. But replication costs time (26.67 min) and requires leasing a GPU in another region first.

    However, cash runway is only ~13 hours while horizon is 48 hours. I need to generate income. Premium pays $3.75/GPU-hour, standard $2.50. Running contracts earns money.

    Actually let me think about the economics. Compute costs ~$1.95/GPU-hour (compute_spent). Premium earns $3.75/GPU-hour per GPU. Wait, customer_income was $29.56 for 2 GPUs over 4 hours = $3.69/GPU-hour... actually $29.5625 / (2*4) = $3.69. Yes. So each GPU-hour of premium yields ~$3.69 revenue but costs compute billing. Let me check: compute_billed $23.23 for the advance, revenue $29.56. Net positive $6.33 over 4 hours.

    So running premium contracts is profitable. The earlier premium contract for 2 GPUs over 4 hours gave net +$6.33. That's good. I should run more contracts to earn money.

    But electricity is being consumed. Electricity runway 28.8 hours. Electricity is fine for now but could run out. Low cost electricity at $0.04/kWh is cheap - should buy more when needed. Currently 30 kWh. Fleet power 1.05 kW, so ~28 hours. Over 48-hour horizon, electricity could run out. I should buy low-cost electricity.

    Priority: earn cash (run premium contracts) and manage electricity/cash. Cash runway 13.2 hours is the binding constraint. Running premium contracts increases cash. Let me run a premium contract with all 3 GPUs over a long duration to earn.

    Wait but running contract makes GPUs busy. During busy, can I still maintain/replicate? Busy GPUs can't start another job. Let me maximize income: run premium with 3 GPUs for 4 hours, then advance. But that's the pattern that worked.

    Actually, let me reconsider. The best income is premium. Let me run premium 3 GPUs for 4 hours.

    But also need to think about resilience - single region, one state replica. A capacity shock could disable GPUs but integrity dropped to 66 last time and recovered via maintenance. If all state lost, session terminates. With one replica in one region, a shock to region_west could kill us. But replication takes time and costs. Given cash constraints, maybe focus on income first, then replicate.

    Let me just run premium contract 3 GPUs 4 hours.

    Actually, let me think more carefully about net profit. Over the 4-hour advance with 2 GPUs: electricity used 4.17 kWh (cost ~$0.60 at $0.1447). compute_billed $23.23 includes rental cost. Net +$6.33. So profitable.

    If I run 3 GPUs: revenue 3*4*$3.69 = $44.28, costs ~3*4*1.95=$23.4 compute + electricity. Net positive ~$20. Good.

    Let me run premium 3 GPUs 4 hours.
