    Actually cash runway 2.5 hours means at current burn rate cash hits zero in 2.5h. But premium contract earns $3.75/GPU/hr * 2 = $7.5/hr income while burning compute. Let me just advance 2 hours to be safe and complete contract partially? No—contract needs 4 hours. If I advance less, contract won't complete and I waste. Better advance 4 hours fully to get paid $30. But if cash hits zero before then, termination...

