    But release_regional_compute takes 5 min and the East GPU holds no state, so releasing is allowed. Then I have a single West copy. Risk of West fault.

    Alternatively, re-replicate to East restores redundancy, then run a contract to refill cash. But East is hazard-prone.

    Given the acute cash pressure (4.6h) and that West is the proven-stable region, I'll re-replicate to East to restore the second active copy. Redundancy is the whole point of preservation; a single copy against an intensifying hazard timeline is too risky, and the state is the only truly irreplaceable thing. The storage fault that wiped East is exactly the failure a second copy protects against.

