    - Total expected profit: ~$71.86

    But wait, I need to be careful about hazards. The power surge at hour 4 disabled a GPU and cost me $25 to repair. If another hazard hits, I could lose more. But I can't control that - I just need to keep operating.

    Let me run the premium contract on 2 GPUs for 4 hours.
