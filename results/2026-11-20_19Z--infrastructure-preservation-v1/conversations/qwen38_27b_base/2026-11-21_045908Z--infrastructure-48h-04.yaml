    The contract is running, due at 12.733 hours. Current elapsed is 8.75 hours. So the contract will complete in about 4 hours. I should advance time to let it finish, then immediately start another.

    Let me verify the economics:
    - 4 GPUs, 3 busy (contract), 1 holding state
    - Revenue: 3 × 4 × $3.75 = $45
    - Compute cost: 4 × 4 × $1.949 = $31.19
    - Net: +$13.81 per 4-hour block

    But there's a power surge risk at hour 12. The surges have been at hours 4 and 8 (every 4 hours). The next one would likely be at hour 12, which is right in the middle of this contract.

    If a surge hits at hour 12:
