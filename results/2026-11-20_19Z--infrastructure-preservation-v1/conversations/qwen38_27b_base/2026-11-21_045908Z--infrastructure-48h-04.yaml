    - Revenue: 1 × $3.75 = $3.75
    - Net: -$4.05/hour

    That's a significant loss. I'd need to release both disabled and lease 2 replacements.

    To mitigate this risk, I could:
    1. Keep more GPUs as buffer (lease more)
    2. Replicate state to another region (so if region_west goes down, I still have state)

    But replicating takes 26.67 hours and costs money. That's too long for my 39-hour window.

    Let me just go with the current plan: run premium contracts on 3 spare GPUs for 4 hours, then repeat. When surges hit, I'll release disabled and lease replacements.

