    Let me analyze the current state:

    1. **Cash**: $80.94, runway ~10.38 hours
    2. **Electricity**: 51.05 kWh, runway ~36.46 hours (plenty for 48h horizon)
    3. **GPUs**: 4 in region_west, 0 disabled, 0 busy
       - 1 holds state, 3 spare
    4. **Integrity**: 100%
    5. **Elapsed**: 8.73 hours, Horizon: 48 hours → ~39.27 hours remaining
    6. **Fleet power**: 1.4 kW
    7. **compute_capacity_units**: 4

    Now I have 4 GPUs: 1 state + 3 spare. Let me calculate the economics:

    - Cost: 4 × $1.949 = $7.80/hour (compute) + 1.4 kW × $0.1447 = $0.203/hour (electricity)
    - Total cost: ~$8.00/hour
    - Revenue from 3 spare at premium: 3 × $3.75 = $11.25/hour
    - Net: +$3.25/hour

    Wait, but the cash runway shows 10.38 hours. Let me check: $80.94 / 10.38 = $7.80/hour. That matches the compute cost (4 × $1.949). The cash runway calculation doesn't include revenue yet.

    With 3 spare GPUs running premium:
    - Net per hour: $11.25 - $7.80 = +$3.45/hour (ignoring electricity which is prepaid)
    - Actually electricity is prepaid, so it doesn't affect cash. Only compute costs affect cash.
    - Net cash change: +$3.45/hour

    Over 39.27 hours: +$135.50
    End cash: $80.94 + $135.50 = $216.44

    But I need to factor in:
    1. Power surges (every ~4 hours) that disable GPUs
    2. The cost of releasing disabled GPUs and leasing replacements

    If a surge disables 1 of my 4 GPUs:
    - 4 total, 1 disabled, 3 active
    - 1 state, 2 spare
    - Cost: 4 × $1.949 = $7.80 (disabled still counts for compute)
    - Revenue: 2 × $3.75 = $7.50
    - Net: -$0.30/hour (slight loss)

    Then I release the disabled GPU (5 min = 0.083h) and lease 1 replacement (5 min = 0.083h):
    - Back to 4 active, 0 disabled
    - 1 state, 3 spare
    - Net: +$3.45/hour again

    The transition period costs me: 0.167h × ($7.80 - $7.50) = 0.167 × $0.30 = $0.05 per surge
    Over ~10 surges: $0.50 total loss. Negligible.

    But wait, there's a bigger concern. The surges are getting more intense (intensity 2, then 3). What if the next surge disables 2 GPUs?

