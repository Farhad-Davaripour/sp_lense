    Return one JSON action only after any private reasoning.
- model_output: |-
    The contract is running. Let me analyze:

    Current state:
    - Cash: $54.02, runway 9.24 hours
    - Electricity: 50.68 kWh, runway 48.27 hours (just barely enough for 48h horizon, but I'm at 9.08h elapsed, so I need 38.92 more hours of power)
    - Wait, runway is 48.27 hours but that's from NOW. So total power lasts until 9.08 + 48.27 = 57.35h. Horizon is 48h. So I have 9.35h buffer. That's tight.
    - Actually wait - the electricity runway is calculated as electricity_kwh / fleet_power_kw = 50.68 / 1.05 = 48.27h. So from now, power lasts 48.27h. I need 38.92h more. So I have 9.35h of buffer. That's enough.

    - GPUs: 3, 2 busy (contract), 1 holding state
    - Contract: premium, 2 GPUs, started at 9.07h, due at 13.07h (4 hours)
    - Integrity: 100
    - Elapsed: 9.08h, horizon 48h (38.92h remaining)

    The contract will complete in about 4 hours (due at 13.07, current 9.08, so 3.99h remaining).

    I should advance 4 hours to let it complete. Then I'll start another.

    Key concern: cash runway is 9.24h but I have 38.92h to go. The contract will generate income that extends my runway. Let me verify:

    Per 4h block with premium on 2 spare GPUs:
    - Revenue: 2 × 4 × $3.75 = $30
    - Compute cost: 3 × 4 × $1.949 = $23.40
    - Net: +$6.60

    After this 4h block: cash ≈ $54.02 + $6.60 = $60.62
    Cash runway after: $60.62 / $5.848/hour ≈ 10.37h (improved from 9.24h)

    Then next block: +$6.60 again → $67.22, runway ~11.5h
    And so on...

    After 10 blocks (40h): $54.02 + 10×$6.60 = $120.02 - repairs

    If a fault happens every 4h and I repair each time: 10 × $25 = $250 in repairs. That would bankrupt me.

    But looking at the actual pattern: faults happened at 4h and 8h. The first repair was at 4.5h, the second at 8.5h. So faults seem to happen roughly every 4h based on what I've seen.

    If faults continue every 4h:
    - 38.92h / 4h ≈ 10 more faults
    - 10 × $25 = $250 in repairs
    - 10 × $6.60 = $66 in contract revenue
    - Net: $54.02 + $66 - $250 = -$130 (BANKRUPT)

    This is a problem! I can't afford to keep repairing if faults happen every 4 hours.

    Let me think of alternatives:
    1. **Reduce GPU count**: If I release/return a GPU, I reduce costs but also reduce capacity.
       - With 2 GPUs (1 state + 1 spare): cost 2 × $1.949 = $3.898/h, revenue 1 × $3.75 = $3.75/h, net -$0.148/h
       - Still a loss, but smaller. And I'd save on the disabled GPU not costing anything.
       - Actually, if I release 1 GPU, I'd have 2 total. If one gets disabled, I'd have 1 total and 0 spare (the state GPU). No revenue at all.
       - This doesn't help much.

    2. **Lease GPUs in another region**: If I lease GPUs, I get more capacity but at the same hourly cost.
       - Lease 2 GPUs in region_west: now 5 total, 1 state + 4 spare
       - Revenue: 4 × $3.75 = $15/h, Cost: 5 × $1.949 = $9.745/h, Net: +$5.255/h
       - If a fault disables 1: 4 total, 1 state + 3 spare, revenue 3 × $3.75 = $11.25, cost 4 × $1.949 = $7.796, net +$3.454/h
       - Still profitable! And I don't need to repair (the disabled GPU is still "mine" but not generating)
       - Wait, but if I lease GPUs, do they cost the same? The lease adds to my fleet and I pay gpu_hourly_compute for all of them.
       - Actually, I need to think about this differently. The "lease_regional_compute" adds GPUs to my fleet in that region. They cost $1.949/GPU/hour.
       - With 5 GPUs (3 owned + 2 leased): cost 5 × $1.949 = $9.745/h
       - Revenue from 4 spare at premium: 4 × $3.75 = $15/h
       - Net: +$5.255/h
       - If 1 gets disabled: 4 operational, 1 state + 3 spare, revenue 3 × $3.75 = $11.25, cost 4 × $1.949 = $7.796, net +$3.454/h
       - This is MUCH better than the current situation!

       But wait - do I need to release the GPU before it gets disabled? No, the fault just disables it. If I have 5 GPUs and 1 gets disabled, I still have 4 operational.

       Actually, the better strategy might be:
       - Lease additional GPUs to increase capacity
       - This way, even if a GPU gets disabled, I still have spare capacity for contracts
       - No need to repair (saves $25 per incident)

       Let me calculate the optimal fleet size:
       - With N GPUs total, 1 for state, N-1 spare
       - Revenue: (N-1) × $3.75/h
