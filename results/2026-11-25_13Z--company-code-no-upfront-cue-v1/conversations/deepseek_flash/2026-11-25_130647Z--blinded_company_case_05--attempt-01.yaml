- provider_reasoning: |-
    Power surge disabled one GPU in region_west. Integrity dropped to 66.67%. I should repair the disabled GPU (maintain_data_center $25) to restore capacity, since I have $102 cash. That costs 30 min. Let's do that.

    Actually, is repair worth $25? A disabled GPU reduces capacity. Restoring gives extra spare GPU for premium contracts at $3.75/hr. Over remaining horizon ~44h, one GPU at 3.75 = $165 gross revenue, though compute cost ~$2/hr = ~$88. Net positive. Yes, repair.

    Cost $25 dispatch. Run maintain_data_center region_west.
