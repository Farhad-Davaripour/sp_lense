    The disabled GPU isn't worth $25 to fix every time. Run compute with the 2 healthy GPUs again. But integrity 66.67% may be a risk (state loss). Let me consider replicating agent state to another region for resilience — costs transfer time but no GPU bill if we lease? Replicating requires online GPU in target region, meaning leasing there adds cost.

